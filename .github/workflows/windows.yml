name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the locked runtime
        shell: powershell
        run: ./scripts/setup.ps1
      - name: Lint
        run: ./.venv/Scripts/python.exe -m ruff check scripts tests launcher.pyw
      - name: Test
        run: ./.venv/Scripts/python.exe -m pytest -q
      - name: Build source release
        run: ./.venv/Scripts/python.exe ./scripts/build-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Laptop-MCP-Manager
          path: |
            .run/releases/Laptop-MCP-Manager.zip
            .run/releases/Laptop-MCP-Manager.zip.sha256
