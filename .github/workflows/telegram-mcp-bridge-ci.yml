name: Telegram MCP bridge checks
on:
  push:
    branches: [telegram-mcp-bridge-2026]
    paths:
      - 'telegram_mcp_bridge/**'
      - '.github/workflows/telegram-mcp-bridge-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram_mcp_bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev
      - run: npm test
      - run: node --check server.mjs
