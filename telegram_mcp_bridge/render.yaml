services:
  - type: web
    name: chatgpt-telegram-mcp-bridge
    runtime: node
    plan: free
    rootDir: telegram_mcp_bridge
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: MCP_ROUTE_TOKEN
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_USER_ID
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
